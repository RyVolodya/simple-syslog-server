name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend / TypeScript build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend / Vite build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build

  docker:
    name: Docker / Compose and image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Build backend image
        run: docker build -t simple-syslog-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t simple-syslog-frontend:ci ./frontend
      - name: Build collector image
        run: docker build -t simple-syslog-collector:ci ./collector
